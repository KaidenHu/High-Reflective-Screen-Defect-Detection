# Ultralytics YOLOv8 基础配置，替换主干并添加CA
# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOP
# 主干网络配置
backbone:
  # 基础配置：MobileNetV3-Small 的核心层 + CA
  - [-1, 1, Conv, [16, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [24, 3, 2]]    # 1-P2/4
  - [-1, 2, C2f, [24, True]]     # 2
  
  # MobileNetV3 核心构建块：倒残差结构
  # 通过重复模式模拟 MobileNetV3 的 bneck 模块
  - [-1, 1, InvertedResidual, [24, 48, 3, 2, True]]    # 3-P3/8  扩展维度48
  - [-1, 2, InvertedResidual, [48, 64, 3, 2, False]]   # 4-P4/16 扩展维度64
  - [-1, 3, InvertedResidual, [64, 64, 3, 1, True]]    # 5       扩展维度64
  - [-1, 1, InvertedResidual, [64, 96, 3, 2, True]]    # 6-P5/32 扩展维度96
  - [-1, 3, InvertedResidual, [96, 96, 3, 1, True]]    # 7       扩展维度96
  - [-1, 1, InvertedResidual, [96, 160, 5, 2, True]]   # 8       扩展维度160
  - [-1, 2, InvertedResidual, [160, 160, 5, 1, True]]  # 9       扩展维度160
  - [-1, 1, InvertedResidual, [160, 320, 5, 2, True]]  # 10      扩展维度320
  - [-1, 1, Conv, [960, 1, 1]]     # 11 扩展通道：1x1卷积升维
  - [-1, 1, CA, [960]]              # 12 添加CA注意力模块
  - [-1, 1, SPPF, [960, 5]]        # 13 SPPF池化

# 检测头配置
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # 从主干4层获取特征( P4 )
  - [-1, 3, C2f, [512]]            # 特征融合层

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]      # 从主干2层获取特征( P3 )
  - [-1, 3, C2f, [256]]            # 最终检测层 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     
  - [-1, 3, C2f, [512]]            # 检测层 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]     
  - [-1, 3, C2f, [1024]]           # 检测层 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]
