#修改了主干网络，用GhostConv替换了原始的Conv层，并在主干网络末尾添加了CA注意力机制。保持了原始YOLOv8的头部结构，仅调整了索引以适配CA层的输出。这种修改旨在提升模型的效率和性能，尤其是在小目标检测方面。
# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# GhostConv + CA modification based on YOLOv8s

# Parameters
nc: 7
scales:
  #n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
    #m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
    #l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
    #x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS


# Backbone (替换 Conv -> GhostConv, 添加 CA)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, GhostConv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, GhostConv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, GhostConv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 1, CA, [1024]]   # 输入1024，输出1024

# Head (保持原始 YOLOv8 head，仅修改索引以适配 CA 层)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 从 CA 层上采样
  - [[-1, 6], 1, Concat, [1]]                   # cat backbone P4 (索引6)
  - [-1, 3, C2f, [512]]                         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                   # cat backbone P3 (索引4)
  - [-1, 3, C2f, [256]]                         # 16 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]                  # cat head P4
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]                        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]             # Detect(P3, P4, P5)
