# YOLOv8s + Partial GhostConv + CA
# 更适合缺陷检测

nc: 7

scales:
  s: [0.33, 0.50, 1024]

# =========================
# Backbone
# =========================
backbone:
  # [from, repeats, module, args]

  # 浅层使用 GhostConv
  - [-1, 1, GhostConv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]     # 1-P2/4

  - [-1, 3, C2f, [128, True]]

  # 深层恢复标准 Conv
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 6, C2f, [256, True]]

  # 在小目标层后加入 CA
  - [-1, 1, CA, [256]]

  - [-1, 1, Conv, [512, 3, 2]]          # 6-P4/16
  - [-1, 6, C2f, [512, True]]

  # 中层再加 CA
  - [-1, 1, CA, [512]]

  - [-1, 1, Conv, [1024, 3, 2]]         # 9-P5/32
  - [-1, 3, C2f, [1024, True]]

  - [-1, 1, SPPF, [1024, 5]]            # 11

# =========================
# Head
# =========================
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                 # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                 # 17 (P3)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                 # 20 (P4)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]                # 23 (P5)

  - [[17, 20, 23], 1, Detect, [nc]]
